[project]
name = "relay-telemetry"
version = "0.1.0"
description = "Tiny Elko Relay telemetry client (stdlib only)"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["relay_telemetry"]
